<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Voisins des Augustins</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <header class="site-banner">
    <img src="assets/banner.jpg" alt="Les Voisins des Augustins" class="banner-img">
  </header>

  <main>
    <section class="intro-section">
      <h1 id="intro-title" class="intro-title"></h1>
    </section>

    <section id="important-section" class="important-section" hidden>
      <div class="section-divider">
        <span class="divider-label">Important</span>
      </div>
      <time id="important-date" class="important-date" datetime="" hidden></time>
      <p id="important-text" class="important-text"></p>
      <a id="important-link" class="important-btn" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
    </section>

    <section id="news-section" class="news-section" hidden>
      <div class="section-divider">
        <span class="divider-label">Nouvelles</span>
      </div>
      <div id="news-grid" class="news-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copyright">
        &copy; Les Voisins des Augustins <span id="footer-year"></span>
      </p>z
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
